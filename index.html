<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonshot Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="start-overlay">
      <h1>Moonshot Mission</h1>
      <button id="start-btn">Let&rsquo;s go to the Moon</button>
    </div>
    <div id="prepare-container">
      <button id="prepare-btn">Prepare</button>
    </div>
    <div
      id="character-popup"
      class="popup-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Character and gear"
    >
      <div class="popup-panel">
        <button id="popup-close-btn" class="popup-close-btn" aria-label="Close">&times;</button>
        <div class="popup-content">
          <div id="character-viewport" class="character-viewport">
            <div id="viewport-hint" class="viewport-hint">Drag to turn</div>
          </div>
          <div class="gear-column">
            <h2 class="gear-title">Choose your gear</h2>
            <div id="gear-list"></div>
          </div>
        </div>
      </div>
    </div>
    <button id="settings-btn" title="Settings">&#9881;</button>
    <div id="settings-panel">
      <div class="settings-header">Settings</div>
      <label class="settings-row"><input type="checkbox" id="invertH" /> <span>Invert horizontal drag</span></label>
      <label class="settings-row"><input type="checkbox" id="invertV" /> <span>Invert vertical drag</span></label>
      <label class="settings-row">Horizontal sensitivity <input type="range" id="sensH" min="0" max="3" step="0.1" value="1" /></label>
      <label class="settings-row">Vertical sensitivity <input type="range" id="sensV" min="0" max="3" step="0.1" value="1" /></label>
      <div class="settings-actions">
        <button id="reset-btn">Reset</button>
        <button id="close-btn">Close</button>
      </div>
    </div>
    <div id="cockpit-view" class="cockpit-view hidden" role="region" aria-label="Rocket Cockpit">
      <!-- TEMPORARY: dev button to return to launch site -->
      <button id="cockpit-dev-back-btn" class="cockpit-dev-back-btn" type="button" title="Dev shortcut">
        Back to launch site (dev)
      </button>
      <div id="cockpit-look-hint" class="cockpit-look-hint">Drag to look around</div>
    </div>
    <div id="board-transition-overlay" class="board-transition-overlay hidden" aria-hidden="true">
      <div id="board-transition-text" class="board-transition-text">Mission begins</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
